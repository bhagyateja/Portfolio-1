{% extends "base.html" %}
{% load static %}
{% block content1 %}
<div class="row">

    {% for eachitem in experience %}
        <div class="jumbotron d-flex align-items-center justify-content-between w-100 my-2">

            <div class="col-md-8">
                <h1 class="display-5">{{ eachitem.company }}</h1>
                <p class="lead">{{ eachitem.position }}</p>
            </div>

            <div class="col-md-4 text-end">
                <img src="{% static 'images/ExperinceLetter.png' %}"
                     alt="Experience Letter"
                     class="img-thumbnail"
                     style="max-width: 150px; height: auto; cursor: pointer;"
                     data-bs-toggle="modal"
                     data-bs-target="#imageModal">
            </div>

        </div>
    {% endfor %}

</div>

<!-- Modal HTML -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-body text-center">
        <img src="{% static 'images/ExperinceLetter.png' %}" alt="Experience Letter Full" class="img-fluid">
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS (Place before closing body tag or here if not already in base.html) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% endblock content1 %}
